[package]
name = "kpod"
version = "0.6.25"
edition.workspace = true
license.workspace = true
description = "Podcast download daemon (LIPC service dev.qingshan.kpodd) for the kpod Kindle package"
build = "build.rs"

[lib]
name = "kpodd"
path = "src/lib.rs"

[[bin]]
name = "kpodd"
path = "src/bin/kpodd.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
url = "2"
minimp3 = "0.5"
