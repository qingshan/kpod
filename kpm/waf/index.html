<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>kpod</title>
<link rel="stylesheet" type="text/css" href="waf-base.css?v=0.6.25">
<link rel="stylesheet" type="text/css" href="style.css?v=0.6.25">
</head>
<body>
<div class="page">
    <div id="view-now" class="view">
        <div id="player" class="player">
            <div id="np-title" class="np-title">Nothing queued</div>
            <div class="player-meta">
                <span id="np-meta" class="np-meta">&nbsp;</span>
            </div>
            <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
            <div id="np-time" class="np-time">&nbsp;</div>
            <div class="transport">
                <div class="transport-left">
                    <button id="btn-back15" type="button" title="Rewind 15 seconds" aria-label="Rewind 15 seconds">&#xF04A;<span class="n">15</span></button>
                    <button id="btn-play" type="button" title="Play" aria-label="Play">&#xF04B;</button>
                    <button id="btn-fwd15" type="button" title="Skip 15 seconds" aria-label="Skip 15 seconds">&#xF04E;<span class="n">15</span></button>
                    <button id="btn-bt" type="button" title="Bluetooth speaker" aria-label="Bluetooth speaker">&#xF293;</button>
                </div>
                <div class="transport-right">
                    <button id="btn-up-next" type="button" title="Up next" aria-label="Up next">&#xF03A;</button>
                    <button id="btn-explore" type="button" title="Explore" aria-label="Explore">&#xF002;</button>
                    <button id="btn-compact" type="button" title="Compact" aria-label="Compact">&#xF066;</button>
                </div>
            </div>
            <div id="error" class="error"></div>
        </div>
        <div id="transcript-panel">
            <div id="transcript-meta" class="transcript-meta"></div>
            <div id="transcript-body" class="transcript-copy"></div>
        </div>
        <div id="panel-upnext" style="display:none">
            <div id="playlist" class="list"></div>
            <div id="pl-pager" class="pager"></div>
        </div>
        <div id="panel-explore" style="display:none">
            <div class="field search-row episode-search">
                <button id="btn-feed" type="button"><span class="button-icon" aria-hidden="true">&#xF03A;</span> All feeds</button>
                <input type="text" id="f-search" value="" placeholder="Episode or show" aria-label="Search episodes">
                <button id="btn-search" type="button"><span class="button-icon" aria-hidden="true">&#xF002;</span> Search</button>
                <span id="ex-pager" class="pager"></span>
            </div>
            <div id="explore-list" class="list"></div>
        </div>
    </div>
</div>

<div id="overlay" class="overlay" style="display:none">
    <div class="overlay-header">
        <button id="overlay-close" type="button" class="overlay-icon" title="Close" aria-label="Close">&#xF00D;</button>
        <div class="overlay-title" id="overlay-title">Feeds</div>
    </div>
    <div id="overlay-body"></div>
</div>

<script type="text/javascript" src="waf-base.js?v=0.6.25"></script>
<script type="text/javascript" src="core.js?v=0.6.25"></script>
<script type="text/javascript" src="views.js?v=0.6.25"></script>
<script type="text/javascript" src="overlay.js?v=0.6.25"></script>
<script type="text/javascript" src="script.js?v=0.6.25"></script>
</body>
</html>
